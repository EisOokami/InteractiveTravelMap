services:
    loki:
        image: grafana/loki:2.9.6
        container_name: interactive-map-trip-loki
        restart: unless-stopped
        ports:
            - "127.0.0.1:3100:3100"
        volumes:
            - ./backend/loki-config.yaml:/etc/loki/local-config.yaml:ro
            - loki-data:/loki
        command: -config.file=/etc/loki/local-config.yaml
        mem_limit: 700m
        cpus: 1.0
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q --spider http://localhost:3100/ready || exit 1",
                ]
            interval: 30s
            timeout: 5s
            retries: 3

    promtail:
        image: grafana/promtail:2.9.6
        container_name: interactive-map-trip-promtail
        restart: unless-stopped
        volumes:
            - ./backend/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
            - ./backend/logs:/var/logs/app:ro
            - promtail-positions:/tmp
        command: -config.file=/etc/promtail/config.yml
        depends_on:
            - loki
        mem_limit: 150m
        cpus: 0.3

    grafana:
        image: grafana/grafana:10.4.2
        container_name: interactive-map-trip-grafana
        restart: unless-stopped
        ports:
            - "127.0.0.1:3200:3000"
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
            GF_USERS_ALLOW_SIGN_UP: ${GRAFANA_ALLOW_SIGN_UP:-false}
            GF_INSTALL_PLUGINS: ${GRAFANA_INSTALL_PLUGINS:-}
        volumes:
            - grafana-data:/var/lib/grafana
            - ./backend/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./backend/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./backend/grafana-dashboards:/var/lib/grafana/dashboards:ro
        depends_on:
            - loki
        mem_limit: 300m
        cpus: 0.4

volumes:
    loki-data:
    grafana-data:
    promtail-positions:
